[package]
name = "bili-music-sync"
version = "0.1.0"
edition = "2021"
description = "BiliMusic 一起听 同步协议 / 房间服务器 / 客户端"

[lib]
name = "bili_music_sync"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
axum = { version = "0.8", features = ["ws", "query"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
