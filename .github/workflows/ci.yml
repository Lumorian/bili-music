name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build

  rust:
    name: Rust 构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 安装 Tauri 的 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: 一起听核心库测试
        # 含 MQTT / WebSocket 端到端用例；联网用例内部自带串行锁
        run: cargo test -p bili-music-sync
      - name: 造一个占位的前端产物
        # tauri::generate_context!() 在**编译期**检查 frontendDist 目录是否存在，
        # 缺失直接 panic（error: proc macro panicked）。这个 job 只做 Rust 检查，
        # 不需要真的前端产物，放一个最小的 index.html 就够了。
        # 注意 TAURI_SKIP_DEVSERVER_CHECK 管不了这个检查，只建目录是唯一办法。
        run: |
          mkdir -p dist
          printf '<!doctype html><meta charset="utf-8"><title>placeholder</title>\n' > dist/index.html
      - name: 编译桌面端
        run: cargo check -p bili-music
