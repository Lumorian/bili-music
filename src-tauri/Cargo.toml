[package]
name = "bili-music"
version = "0.1.0"
description = "BiliMusic - 只用来听歌的 B 站客户端"
authors = ["lumorian"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "bili_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
bili-music-sync = { path = "../sync-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip", "brotli", "cookies"] }
axum = "0.8"
futures-util = "0.3"
md-5 = "0.10"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
log = "0.4"
tauri-plugin-log = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
